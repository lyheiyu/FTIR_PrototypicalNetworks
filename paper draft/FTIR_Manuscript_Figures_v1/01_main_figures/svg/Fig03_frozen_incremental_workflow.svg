   <g id="text_1">
    <text style="font: 10px 'DejaVu Sans'" transform="translate(55.6335 64.511962)">4 source base classes</text>
    <text style="font: 10px 'DejaVu Sans'" transform="translate(32.331938 75.709775)">Group-disjoint train / validation</text>
    <text style="font: 10px 'DejaVu Sans'" transform="translate(47.9085 86.907587)">2 novel classes excluded</text>
   </g>
   <g id="text_2">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(294.538781 65.355806)">Initial representation only</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(293.595891 75.433837)">CE-M1 / episodic M1 / PCA</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(249.649875 85.511869)">Select neural checkpoint on source validation</text>
   </g>
   <g id="text_3">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(616.272187 65.355806)">FREEZE</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(537.600937 75.433837)">Encoder / PCA and source covariance prior</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(554.362031 85.511869)">No incremental parameter updates</text>
   </g>
   <g id="text_4">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(80.394328 209.499806)">Session 0: 4 base classes</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(72.889875 219.577837)">20 references per base class</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(44.111672 229.655869)">References drawn from base-train groups</text>
   </g>
   <g id="text_5">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(326.867344 209.499806)">Session 1: register novel class 1</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(338.29875 219.577837)">K = 1 / 5 / 10 / 20 supports</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(319.066875 229.655869)">Update only the arriving class state</text>
   </g>
   <g id="text_6">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(584.663344 209.499806)">Session 2: register novel class 2</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(596.09475 219.577837)">K = 1 / 5 / 10 / 20 supports</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(570.921469 229.655869)">Keep previous class states unchanged</text>
   </g>
   <g id="text_7">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(74.318625 338.120606)">4 seen classes × 15 queries</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(56.833313 348.198637)">Accuracy, Macro-F1, per-class recall</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(50.375813 358.276669)">Base / previous / current novel metrics</text>
   </g>
   <g id="text_8">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(336.020625 338.120606)">5 seen classes × 15 queries</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(318.535313 348.198637)">Accuracy, Macro-F1, per-class recall</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(312.077812 358.276669)">Base / previous / current novel metrics</text>
   </g>
   <g id="text_9">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(593.816625 338.120606)">6 seen classes × 15 queries</text>
