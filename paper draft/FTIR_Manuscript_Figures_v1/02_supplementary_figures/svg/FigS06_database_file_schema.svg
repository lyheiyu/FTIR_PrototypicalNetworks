   <g id="text_1">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(56.233406 90.006778)">Spectral CSV (one file / resolution)</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(133.632 100.084809)"/>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(64.992234 110.162841)">Row 1: generic column indices</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(44.482781 120.240872)">Row 2: physical wavenumber metadata</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(42.443016 130.366153)">Rows 3+: ID | polymer | class ID | values</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(54.884813 140.694497)">C4: 3,736 values; C8: 1,869 values</text>
   </g>
   <g id="text_2">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(336.437578 89.654934)">Duplicate row mapping CSV</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(399.24 99.732966)"/>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(338.459766 109.810997)">source_csv_row / source_id</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(340.607813 120.139341)">polymer / class_id / status</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(343.117266 130.467684)">retained_source_csv_row</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(356.924531 140.796028)">retained_source_id</text>
   </g>
   <g id="text_3">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(589.349953 89.905247)">Paired group representatives CSV</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(664.848 99.983278)"/>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(636.5205 110.061309)">group / label</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(620.672062 120.139341)">c4_index / c8_index</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(605.876906 130.467684)">c4_id / c8_id / alias counts</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(588.979406 140.796028)">2,047 conservative record groups</text>
   </g>
   <g id="text_4">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(93.166453 307.959019)">common_grid.npy</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(133.632 318.287362)"/>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(55.464891 328.365394)">1,868 explicit physical coordinates</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(71.677547 338.443425)">399.1927–4,000.6045 cm⁻¹</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(92.356453 348.521456)">Shared for C4 / C8</text>
   </g>
   <g id="text_5">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(349.61625 308.084175)">split.json (task / seed)</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(399.24 318.162206)"/>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(332.709609 328.240237)">base train / validation / query</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(337.489453 338.318269)">novel support / query pools</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(336.770859 348.3963)">Roles shared across C4 / C8</text>
   </g>
   <g id="text_6">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(604.746281 303.045159)">episodes.json (task / seed)</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(664.848 313.123191)"/>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(606.159562 323.201222)">20 base references / class</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(585.733078 333.279253)">Nested novel support order (K≤20)</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(600.147844 343.357284)">15 query groups / seen class</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(588.498469 353.435316)">200 matched evaluation episodes</text>
   </g>
   <g id="text_7">
    <text style="font: 10px 'DejaVu Sans'; text-anchor: middle" x="399.24" y="436.6368" transform="rotate(-0 399.24 436.6368)">IDs, CSV row numbers and loaded-array indices are distinct; record groups are not verified specimen IDs.</text>
